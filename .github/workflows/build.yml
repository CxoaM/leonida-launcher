name: Build

# Every push and pull request is checked the same way: the frontend is type
# checked, tested and bundled, the Rust side is formatted, linted and tested, and
# a Windows x64 installer is produced. Releases are handled by release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend · typecheck, tests, bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production bundle
        run: npm run build:web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  rust:
    name: Rust · fmt, clippy, tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-targets

  installer:
    name: Windows x64 installer
    needs: [frontend, rust]
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Pull requests from forks cannot read repository secrets, so the
      # signature is skipped there instead of failing the whole build. Tagged
      # releases (release.yml) refuse to publish unsigned updater artifacts.
      - name: Build NSIS and MSI
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::notice::No signing key available; building without updater artifacts."
            npx tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          } else {
            npx tauri build --bundles nsis,msi
          }

      # The bundler names the installer after the product and version
      # ("Leonida Launcher_1.0.0_x64-setup.exe"). That name has to stay, because
      # the signed latest.json points at it. A second copy with a stable,
      # version-free name is what the README links to.
      - name: Add a stable installer name
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $nsis) { throw "The NSIS installer was not produced." }
          $stable = Join-Path $nsis.DirectoryName "LeonidaLauncher-Setup-x64.exe"
          Copy-Item $nsis.FullName $stable -Force
          if (Test-Path "$($nsis.FullName).sig") {
            Copy-Item "$($nsis.FullName).sig" "$stable.sig" -Force
          }
          Get-ChildItem $nsis.DirectoryName | Select-Object Name, Length

      - name: Write checksums
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files = Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" -or $_.Name -like "*.nsis.zip*" -or $_.Name -like "*.sig" }
          if (-not $files) { throw "No installer was produced under $bundle" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: leonida-launcher-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
